          .head h3{font-size:13px}
          .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
          @media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
          .empty{grid-column:1/-1;text-align:center;padding:28px 12px;font-size:12px;color:var(--mut)}
          .wa{overflow:hidden;display:flex;flex-direction:column}
          .wa .m{height:130px;background:#0f172a}
          .wa img,.wa video{width:100%;height:100%;object-fit:cover;display:block}
          .wa .f{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px}
          .wa .n{font-size:10px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;direction:ltr;text-align:left}
          .hi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px}
