          background-attachment:fixed;padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom));display:flex;justify-content:center}
          .app{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px}
          .panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
          @supports(backdrop-filter:blur(1px)){.panel{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}}
          .card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px}
          header{display:flex;align-items:center;gap:12px}
          .logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;font-weight:900;font-size:22px}
          h1{font-size:20px;font-weight:900}
          .sub{font-size:11px;color:var(--mut)}
          nav{display:flex;gap:4px;padding:6px}
          nav button{flex:1;padding:11px 4px;border:0;border-radius:14px;background:none;color:var(--mut);font:700 12px inherit;font-family:inherit;cursor:pointer}
