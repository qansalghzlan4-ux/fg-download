          .btn.gr{background:var(--green);color:#022c22}
          .opts{display:grid;gap:12px;grid-template-columns:1fr}
          @media(min-width:480px){.opts{grid-template-columns:1fr 1fr}}
          .prog{display:none;padding:14px;gap:10px;flex-direction:column}
          .prog.on{display:flex}
          .bar{height:8px;border-radius:9px;background:#020617;overflow:hidden}
          .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#8b5cf6);transition:width .15s}
          .pline{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
          .msg{font-size:12px;line-height:1.7;color:var(--mut)}
          .err{color:#fda4af}
