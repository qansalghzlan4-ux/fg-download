          <script>
          (function(){
          'use strict';
          const $=id=>document.getElementById(id);
          const HKEY='fg_history_v2', AKEY='fg_api_url', TTL=30*24*60*60*1000;
          const HOSTS={youtube:['youtube.com','youtu.be','youtube-nocookie.com'],instagram:['instagram.com'],tiktok:['tiktok.com'],x:['x.com','twitter.com'],snapchat:['snapchat.com','snap.com']};
          const NAMES={youtube:'YouTube',instagram:'Instagram',tiktok:'TikTok',x:'X',snapchat:'Snapchat',whatsapp:'واتساب'};
          const ICONS={youtube:'▶',instagram:'📷',tiktok:'♪',x:'𝕏',snapchat:'👻',whatsapp:'🟢'};
          const TYPES={video:'فيديو',image:'صورة',audio:'صوت'};
          let platform='youtube', mediaType='video', busy=false, ctrl=null, waUrls=[];

          /* ---------- تخزين آمن ---------- */
          function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
          function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
          function getHistory(){const h=load(HKEY,[]);return Array.isArray(h)?h:[]}

          /* ---------- واجهة ---------- */
          let tt;
          function toast(m,bad){const t=$('toast');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',2600)}
          function tab(n){
            document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===n));
            ['dl','wa','hi'].forEach(k=>$('s-'+k).classList.toggle('on',k===n));
            if(n==='hi')renderHistory();
          }
          document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)tab(b.dataset.tab)});
          function setPlatform(p){platform=p;document.querySelectorAll('.plat').forEach(b=>b.classList.toggle('on',b.dataset.p===p))}
          $('plats').addEventListener('click',e=>{const b=e.target.closest('.plat');if(b)setPlatform(b.dataset.p)});
          $('types').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mediaType=b.dataset.t;
            document.querySelectorAll('#types button').forEach(x=>x.classList.toggle('on',x===b));$('q').disabled=mediaType!=='video'});

          /* ---------- الروابط ---------- */
          function parseUrl(s){
            try{const u=new URL(s.trim());if(u.protocol!=='https:'&&u.protocol!=='http:')return null;return u}catch(e){return null}
          }
          function detect(u){
            const h=u.hostname.toLowerCase();
            for(const p in HOSTS){if(HOSTS[p].some(d=>h===d||h.endsWith('.'+d)))return p}
            return null;
          }
          $('url').addEventListener('input',()=>{const u=parseUrl($('url').value);if(u){const p=detect(u);if(p)setPlatform(p)}});
          $('paste').addEventListener('click',async()=>{
            try{const t=window.FGNative?FGNative.clipboard():await navigator.clipboard.readText();if(t){$('url').value=t.trim();$('url').dispatchEvent(new Event('input'));toast('تم لصق الرابط')}else toast('الحافظة فارغة',true)}
            catch(e){toast('تعذّر الوصول للحافظة، الصق الرابط يدوياً',true);$('url').focus()}
          });

          /* ---------- الإعدادات ---------- */
          $('api').value=load(AKEY,'')||'';
          $('saveApi').addEventListener('click',()=>{
            const v=$('api').value.trim();
            if(v&&!parseUrl(v)){toast('عنوان الخادم غير صالح',true);return}
            save(AKEY,v);toast('تم حفظ إعدادات الخادم');
          });

          /* ---------- التحميل ---------- */
          function progress(pc,st){
            $('pbar').style.width=pc+'%';$('ppc').textContent=Math.round(pc)+'%';if(st)$('pst').textContent=st;
          }
          function setBusy(b){busy=b;$('go').disabled=b;$('prog').classList.toggle('on',b)}

          async function resolveLink(url,type,quality,signal){
            const api=load(AKEY,'');
            if(!api){$('set').open=true;throw new Error('أدخل عنوان خادم التحميل في الإعدادات أولاً')}
            const body={url,videoQuality:quality,downloadMode:type==='audio'?'audio':'auto',audioBitrate:'320',filenameStyle:'basic'};
            let r;
            try{r=await fetch(api,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(body),signal})}
            catch(e){if(e.name==='AbortError')throw e;throw new Error('تعذّر الاتصال بالخادم. تحقق من العنوان والإنترنت')}
            let d;try{d=await r.json()}catch(e){throw new Error('رد غير صالح من الخادم')}
            if(d.status==='error')throw new Error('رفض الخادم الطلب'+(d.error&&d.error.code?': '+d.error.code:''));
            if(d.status==='tunnel'||d.status==='redirect')return[{url:d.url,name:d.filename}];
            if(d.status==='picker'&&Array.isArray(d.picker))return d.picker.filter(x=>x&&x.url).map((x,i)=>({url:x.url,name:'FG_'+Date.now()+'_'+(i+1)+(x.type==='video'?'.mp4':'.jpg')}));
            throw new Error('استجابة غير متوقعة من الخادم');
          }

          function saveBlob(blob,name){
            if(window.FGNative){const fr=new FileReader();fr.onload=()=>FGNative.saveFile(name,blob.type||'application/octet-stream',String(fr.result).split(',')[1]);fr.readAsDataURL(blob);return}
            const href=URL.createObjectURL(blob);
            const a=document.createElement('a');a.href=href;a.download=name;a.rel='noopener';
            document.body.appendChild(a);a.click();a.remove();
            setTimeout(()=>URL.revokeObjectURL(href),60000);
          }

          async function fetchFile(item,signal,onPct){
            const name=item.name||('FG_'+Date.now());
            let r;
            try{r=await fetch(item.url,{signal})}
            catch(e){
              if(e.name==='AbortError')throw e;
              // بديل: فتح الرابط مباشرة إذا منع المتصفح القراءة (CORS)
              const a=document.createElement('a');a.href=item.url;a.download=name;a.target='_blank';a.rel='noopener';
              document.body.appendChild(a);a.click();a.remove();return;
            }
            if(!r.ok)throw new Error('فشل جلب الملف ('+r.status+')');
            const total=+r.headers.get('content-length')||0;
            if(!r.body||!total){const b=await r.blob();onPct(100);saveBlob(b,name);return}
            const rd=r.body.getReader(),parts=[];let got=0;
            for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;onPct(got/total*100)}
            saveBlob(new Blob(parts),name);
          }

          async function startDownload(urlStr){
            if(busy)return;
            const u=parseUrl(urlStr);
            if(!u){toast('الرابط غير صالح',true);return}
            const p=detect(u);
            if(!p){toast('المنصة غير مدعومة: يوتيوب، إنستغرام، تيك توك، سناب شات، X',true);return}
            setPlatform(p);
            const type=mediaType, quality=$('q').value;
            if(window.FGNative){
              const nu=u.href,np=p,nt=type,nq=quality;
              setBusy(true);progress(0,'جاري التحضير...');
              window.fgProgress=(pc,st)=>progress(pc,st);
              window.fgDone=(ok,msg)=>{
                if(ok){progress(100,'اكتمل');addHistory(nu,np,nt==='video'?nq+'p':TYPES[nt],nt);toast(msg);$('url').value=''}
                else toast(msg,true);
                setTimeout(()=>setBusy(false),500);
              };
              FGNative.download(nu,nt,nq);
              return;
            }
            ctrl=new AbortController();setBusy(true);progress(0,'جاري استخراج رابط التنزيل...');
            try{
              const items=await resolveLink(u.href,type,quality,ctrl.signal);
              if(!items.length)throw new Error('لا توجد ملفات متاحة في هذا الرابط');
              for(let i=0;i<items.length;i++){
                progress(0,'جاري التنزيل '+(items.length>1?'('+(i+1)+'/'+items.length+')':'')+'...');
                await fetchFile(items[i],ctrl.signal,pc=>progress(pc));
              }
              progress(100,'اكتمل التنزيل');
              addHistory(u.href,p,type==='video'?quality+'p':TYPES[type],type);
              toast('تم التنزيل بنجاح');
              $('url').value='';
            }catch(e){
              if(e.name==='AbortError')toast('تم إلغاء التنزيل');
              else toast(e.message||'حدث خطأ غير متوقع',true);
            }finally{
              setTimeout(()=>{if(!busy)return;setBusy(false)},600);
              ctrl=null;
            }
          }
          $('go').addEventListener('click',()=>startDownload($('url').value));
          $('cancel').addEventListener('click',()=>{if(window.FGNative)FGNative.cancel();if(ctrl)ctrl.abort()});

          /* ---------- حالات الواتساب ---------- */
          function freeWA(){waUrls.forEach(u=>URL.revokeObjectURL(u));waUrls=[]}
          $('wafile').addEventListener('change',e=>{
            const files=Array.from(e.target.files||[]);
            if(!files.length)return;
            freeWA();
            const g=$('wagrid');g.textContent='';
            files.forEach(f=>{
              const isVid=f.type.startsWith('video/');
              if(!isVid&&!f.type.startsWith('image/'))return;
              const url=URL.createObjectURL(f);waUrls.push(url);
              const c=document.createElement('div');c.className='wa card';
              const m=document.createElement('div');m.className='m';
              const el=document.createElement(isVid?'video':'img');
              el.src=url;
              if(isVid){el.muted=true;el.controls=true;el.preload='metadata';el.playsInline=true}
              else{el.loading='lazy';el.alt=''}
              m.appendChild(el);
              const ft=document.createElement('div');ft.className='f';
              const n=document.createElement('span');n.className='n';n.textContent=f.name;
              const b=document.createElement('button');b.className='btn sm gr';b.type='button';b.textContent='حفظ';
              b.addEventListener('click',()=>{saveBlob(f,'FG_WhatsApp_'+f.name);addHistory('','whatsapp','أصلية','status');toast('تم حفظ الحالة')});
              ft.append(n,b);c.append(m,ft);g.appendChild(c);
            });
            e.target.value='';
            toast('تم تحميل '+files.length+' ملف');
          });
          window.addEventListener('pagehide',freeWA);

          /* ---------- السجل ---------- */
          function cleanHistory(){
            const now=Date.now();
            const h=getHistory().filter(i=>i&&now-i.ts<TTL);
            save(HKEY,h);return h;
          }
          function addHistory(url,plat,quality,type){
            const h=cleanHistory();
            h.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),url,plat,quality,type,ts:Date.now()});
            save(HKEY,h.slice(0,200));
            renderHistory();
          }
          function renderHistory(){
            const h=cleanHistory(),list=$('hlist');
            $('badge').textContent=h.length;
            list.textContent='';
            if(!h.length){const d=document.createElement('div');d.className='empty card';d.textContent='لا توجد تنزيلات في السجل';list.appendChild(d);return}
            h.forEach(i=>{
              const row=document.createElement('div');row.className='hi card';
              const t=document.createElement('div');t.className='t';
              const h4=document.createElement('h4');h4.textContent=(ICONS[i.plat]||'🔗')+' '+(NAMES[i.plat]||i.plat)+' - '+i.quality;
              const p=document.createElement('p');p.textContent=new Date(i.ts).toLocaleString('ar',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
              t.append(h4,p);
              const a=document.createElement('div');a.className='a';
              const mk=(txt,act,cls,dis)=>{const b=document.createElement('button');b.type='button';b.className='ic '+(cls||'');b.textContent=txt;b.dataset.act=act;b.dataset.id=i.id;b.disabled=!!dis;b.title={re:'إعادة التحميل',cp:'نسخ الرابط',rm:'حذف'}[act];return b};
              a.append(mk('↻','re','',!i.url),mk('⧉','cp','',!i.url),mk('✕','rm','d'));
              row.append(t,a);list.appendChild(row);
            });
          }
          $('hlist').addEventListener('click',async e=>{
            const b=e.target.closest('button');if(!b||b.disabled)return;
            const h=getHistory(),it=h.find(x=>x.id===b.dataset.id);
            if(b.dataset.act==='rm'){save(HKEY,h.filter(x=>x.id!==b.dataset.id));renderHistory();toast('تم الحذف من السجل');return}
            if(!it)return;
            if(b.dataset.act==='cp'){
              try{if(window.FGNative)FGNative.copy(it.url);else await navigator.clipboard.writeText(it.url);toast('تم نسخ الرابط')}catch(_){toast('تعذّر النسخ',true)}
            }else if(b.dataset.act==='re'){
              tab('dl');
              mediaType=it.type==='audio'||it.type==='image'?it.type:'video';
              document.querySelectorAll('#types button').forEach(x=>x.classList.toggle('on',x.dataset.t===mediaType));
              $('q').disabled=mediaType!=='video';
              $('url').value=it.url;
              startDownload(it.url);
            }
          });
          $('clearAll').addEventListener('click',()=>{
            if(!getHistory().length)return;
            if(!confirm('هل تريد مسح السجل بالكامل؟'))return;
            try{localStorage.removeItem(HKEY)}catch(e){}
            renderHistory();toast('تم مسح السجل');
          });
          document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderHistory()});

          window.fgMsg=m=>toast(m);
          if(window.FGNative){
            $('set').innerHTML='<summary>⚙ المحرك</summary><p class="msg" style="margin-top:8px">المحرك (yt-dlp) مدمج داخل التطبيق. إذا توقف موقع عن العمل فحدّث المحرك.</p><button class="btn sm" id="upd" type="button" style="margin-top:10px">تحديث المحرك</button>';
            $('upd').onclick=()=>{toast('جاري التحديث...');FGNative.update()};
          }
          renderHistory();
          })();
          </script>
          </body>
          </html>
          __FG_EOF__
      - name: Build APK
        run: |
          cd FGDownload
          gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp FGDownload/app/build/outputs/apk/debug/app-debug.apk FG-Download.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FG Download build ${{ github.run_number }}
          files: FG-Download.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FG-Download-APK
          path: FG-Download.apk
