name: Build FG Download APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project files
        run: |
          mkdir -p FGDownload
          cat > FGDownload/settings.gradle.kts <<'__FG_EOF__'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FGDownload"
          include(":app")
          __FG_EOF__
          mkdir -p FGDownload
          cat > FGDownload/build.gradle.kts <<'__FG_EOF__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __FG_EOF__
          mkdir -p FGDownload
          cat > FGDownload/gradle.properties <<'__FG_EOF__'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          __FG_EOF__
          mkdir -p FGDownload/app
          cat > FGDownload/app/build.gradle.kts <<'__FG_EOF__'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.fg.download"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.fg.download"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              packaging { jniLibs { useLegacyPackaging = true } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.11.0")
              implementation("io.github.junkfood02.youtubedl-android:library:0.17.+")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.17.+")
          }
          __FG_EOF__
          mkdir -p FGDownload/app/src/main
          cat > FGDownload/app/src/main/AndroidManifest.xml <<'__FG_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="FG Download"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:extractNativeLibs="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          __FG_EOF__
          mkdir -p FGDownload/app/src/main/java/com/fg/download
          cat > FGDownload/app/src/main/java/com/fg/download/MainActivity.kt <<'__FG_EOF__'
          package com.fg.download

          import android.annotation.SuppressLint
          import android.content.*
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.util.Base64
          import android.webkit.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.webkit.WebViewAssetLoader
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import org.json.JSONObject
          import java.io.File
          import java.io.IOException
          import java.io.OutputStream

          class MainActivity : AppCompatActivity() {
              private lateinit var web: WebView
              private var chooserCb: ValueCallback<Array<Uri>>? = null
              @Volatile private var ready = false
              @Volatile private var cancelled = false

              private val chooser = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  chooserCb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(r.resultCode, r.data))
                  chooserCb = null
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.apply { javaScriptEnabled = true; domStorageEnabled = true; mediaPlaybackRequiresUserGesture = false }
                  val loader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this)).build()
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(v: WebView, r: WebResourceRequest) = loader.shouldInterceptRequest(r.url)
                      override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest): Boolean {
                          if (r.url.host == "appassets.androidplatform.net") return false
                          try { startActivity(Intent(Intent.ACTION_VIEW, r.url)) } catch (_: Exception) {}
                          return true
                      }
                  }
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(w: WebView, cb: ValueCallback<Array<Uri>>, p: FileChooserParams): Boolean {
                          chooserCb?.onReceiveValue(null); chooserCb = cb
                          return try { chooser.launch(p.createIntent()); true } catch (e: Exception) { chooserCb = null; false }
                      }
                      override fun onJsConfirm(v: WebView, url: String, msg: String, res: JsResult): Boolean {
                          AlertDialog.Builder(this@MainActivity).setMessage(msg)
                              .setPositiveButton("نعم") { _, _ -> res.confirm() }
                              .setNegativeButton("لا") { _, _ -> res.cancel() }
                              .setOnCancelListener { res.cancel() }.show()
                          return true
                      }
                  }
                  web.addJavascriptInterface(Bridge(), "FGNative")
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html")
                  Thread {
                      try { YoutubeDL.getInstance().init(application); FFmpeg.getInstance().init(application); ready = true }
                      catch (e: Exception) { js("fgMsg(${JSONObject.quote("فشل تهيئة المحرك: " + e.message)})") }
                  }.start()
              }

              override fun onBackPressed() { if (web.canGoBack()) web.goBack() else super.onBackPressed() }

              private fun js(code: String) = runOnUiThread { web.evaluateJavascript("window.$code", null) }

              private fun put(name: String, mime: String, write: (OutputStream) -> Unit) {
                  val cv = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      put(MediaStore.MediaColumns.MIME_TYPE, mime)
                      put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/FG Download")
                  }
                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv) ?: throw IOException("تعذّر إنشاء الملف")
                  contentResolver.openOutputStream(uri)!!.use(write)
              }

              inner class Bridge {
                  @JavascriptInterface fun download(url: String, type: String, q: String) {
                      if (!ready) { js("fgDone(false,'المحرك قيد التهيئة، حاول بعد لحظات')"); return }
                      cancelled = false
                      Thread {
                          val dir = File(cacheDir, "dl").apply { deleteRecursively(); mkdirs() }
                          try {
                              val req = YoutubeDLRequest(url)
                              req.addOption("--no-playlist"); req.addOption("--no-mtime")
                              req.addOption("-o", dir.absolutePath + "/%(id)s.%(ext)s")
                              if (type == "audio") {
                                  req.addOption("-x"); req.addOption("--audio-format", "mp3"); req.addOption("--audio-quality", "0")
                              } else {
                                  req.addOption("-f", "bv*[height<=$q]+ba/b[height<=$q]/b")
                                  req.addOption("--merge-output-format", "mp4")
                              }
                              YoutubeDL.getInstance().execute(req, "fg") { p, _, _ -> js("fgProgress(${p.toInt()},'جاري التنزيل...')") }
                              val files = dir.listFiles()?.filter { it.isFile && !it.name.endsWith(".part") && !it.name.endsWith(".ytdl") }.orEmpty()
                              if (files.isEmpty()) throw Exception("لم يتم إنتاج ملف")
                              js("fgProgress(99,'جاري الحفظ...')")
                              files.forEach { f ->
                                  val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(f.extension.lowercase()) ?: "application/octet-stream"
                                  put("FG_${System.currentTimeMillis()}_${f.name}", mime) { o -> f.inputStream().use { it.copyTo(o) } }
                              }
                              js("fgDone(true,'تم الحفظ في Download/FG Download')")
                          } catch (e: Exception) {
                              val m = if (cancelled) "تم الإلغاء"
                              else e.message?.lineSequence()?.lastOrNull { it.isNotBlank() }?.take(160) ?: "فشل التنزيل"
                              js("fgDone(false,${JSONObject.quote(m)})")
                          } finally { dir.deleteRecursively() }
                      }.start()
                  }
                  @JavascriptInterface fun cancel() { cancelled = true; try { YoutubeDL.getInstance().destroyProcessById("fg") } catch (_: Exception) {} }
                  @JavascriptInterface fun update() {
                      Thread {
                          val m = try { YoutubeDL.getInstance().updateYoutubeDL(application, YoutubeDL.UpdateChannel.STABLE); "تم تحديث المحرك" }
                          catch (e: Exception) { "فشل التحديث: " + (e.message ?: "") }
                          js("fgMsg(${JSONObject.quote(m)})")
                      }.start()
                  }
                  @JavascriptInterface fun saveFile(name: String, mime: String, b64: String) {
                      try {
                          put("FG_${System.currentTimeMillis()}_$name", mime) { it.write(Base64.decode(b64, Base64.DEFAULT)) }
                          js("fgMsg('تم الحفظ في Download/FG Download')")
                      } catch (e: Exception) { js("fgMsg(${JSONObject.quote("فشل الحفظ: " + e.message)})") }
                  }
                  @JavascriptInterface fun clipboard(): String {
                      val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                      return cm.primaryClip?.takeIf { it.itemCount > 0 }?.getItemAt(0)?.coerceToText(this@MainActivity)?.toString() ?: ""
                  }
                  @JavascriptInterface fun copy(t: String) {
                      (getSystemService(CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("url", t))
                  }
              }
          }
          __FG_EOF__
          mkdir -p FGDownload/app/src/main/assets
          cat > FGDownload/app/src/main/assets/index.html <<'__FG_EOF__'
          <!DOCTYPE html>
